<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mobile MIDI Visualizer & Editor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    #controls {
      padding: 8px;
      background-color: #1e1e1e;
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      z-index: 10;
      border-bottom: 1px solid #333;
    }
    .btn {
      background-color: #3b82f6;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }
    input[type="file"] {
      display: none;
    }
    select {
      background-color: #2a2a2a;
      color: white;
      border: 1px solid #444;
      padding: 5px;
      border-radius: 6px;
      font-size: 12px;
    }
    .bpm-control {
      display: flex;
      align-items: center;
      gap: 4px;
      background-color: #2a2a2a;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #444;
      font-size: 12px;
    }
    .bpm-control input[type="range"] {
      width: 60px;
      accent-color: #3b82f6;
    }
    /* 追加: トラック管理用のバー */
    #track-bar {
      display: flex;
      gap: 6px;
      align-items: center;
      background-color: #181818;
      padding: 6px 8px;
      border-bottom: 1px solid #333;
      overflow-x: auto;
      white-space: nowrap;
    }
    .track-item {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 4px;
      background-color: #282828;
      font-size: 12px;
      border: 1px solid #444;
      cursor: pointer;
    }
    .track-item.active {
      border-color: #ffffff;
      background-color: #333333;
    }
    .track-color-badge {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }
    #editor-container {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <!-- Tone.js & Tonejs/Midi -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="https://unpkg.com/@tonejs/midi"></script>
</head>
<body>

  <div id="controls">
    <label class="btn" for="midi-input" style="background-color: #8b5cf6;">MIDI読込</label>
    <input type="file" id="midi-input" accept=".mid, .midi">
    
    <button id="play-btn" class="btn" style="background-color: #10b981;">再生</button>
    <button id="mode-btn" class="btn" style="background-color: #f59e0b;">モード: スクロール</button>
    <button id="clear-btn" class="btn" style="background-color: #ef4444;">全消去</button>

    <div class="bpm-control">
      <label for="bpm-slider">BPM:</label>
      <input type="range" id="bpm-slider" min="40" max="240" value="120">
      <span id="bpm-val">120</span>
    </div>
  </div>

  <!-- 【追加】トラック切り替え＆音色変更バー -->
  <div id="track-bar">
    <div id="track-list" style="display: flex; gap: 6px;"></div>
    <button id="add-track-btn" class="btn" style="background-color: #4b5563; padding: 4px 8px;">+ トラック追加</button>
    
    <label for="synth-select" style="font-size: 12px; margin-left: 8px;">音色:</label>
    <select id="synth-select">
      <option value="synth">Synth</option>
      <option value="fm">FM Synth</option>
      <option value="am">AM Synth</option>
      <option value="duo">Duo Synth</option>
    </select>
  </div>

  <div id="editor-container">
    <canvas id="canvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const midiInput = document.getElementById('midi-input');
    const playBtn = document.getElementById('play-btn');
    const modeBtn = document.getElementById('mode-btn');
    const clearBtn = document.getElementById('clear-btn');
    const synthSelect = document.getElementById('synth-select');
    const bpmSlider = document.getElementById('bpm-slider');
    const bpmVal = document.getElementById('bpm-val');
    
    const trackListEl = document.getElementById('track-list');
    const addTrackBtn = document.getElementById('add-track-btn');

    // 音域定義 (全88鍵盤 21: A0 〜 108: C8)
    const MIN_NOTE = 21;
    const MAX_NOTE = 108;
    const TOTAL_NOTES = MAX_NOTE - MIN_NOTE + 1;

    // トラックカラーのプリセット
    const TRACK_COLORS = ['#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6', '#06b6d4'];

    let beatWidth = 40;   
    let noteHeight = 16;  

    // 【拡張】トラック構造のデータ管理
    // tracks = [{ id: 0, name: "Track 1", color: "#3b82f6", synthType: "synth", synth: PolySynth, notes: [...] }]
    let tracks = [];
    let currentTrackIndex = 0;

    let isPlaying = false;
    let currentBeat = 0;
    let playTimer = null;
    let mode = 'scroll'; 
    let bpm = 120;

    let scrollX = 0;
    let scrollY = (TOTAL_NOTES - 24) * noteHeight;

    // --- トラック & 音源管理 ---
    function createSynth(type) {
      let synthClass = Tone.Synth;
      if (type === 'fm') synthClass = Tone.FMSynth;
      if (type === 'am') synthClass = Tone.AMSynth;
      if (type === 'duo') synthClass = Tone.DuoSynth;
      return new Tone.PolySynth(synthClass).toDestination();
    }

    function addTrack(name = null, synthType = 'synth') {
      const id = tracks.length;
      const color = TRACK_COLORS[id % TRACK_COLORS.length];
      const trackName = name || `Track ${id + 1}`;
      
      const newTrack = {
        id: id,
        name: trackName,
        color: color,
        synthType: synthType,
        synth: createSynth(synthType),
        notes: []
      };

      tracks.push(newTrack);
      currentTrackIndex = tracks.length - 1;
      updateTrackUI();
      render();
    }

    function updateTrackUI() {
      trackListEl.innerHTML = '';
      tracks.forEach((t, index) => {
        const item = document.createElement('div');
        item.className = `track-item ${index === currentTrackIndex ? 'active' : ''}`;
        item.innerHTML = `
          <span class="track-color-badge" style="background-color: ${t.color}"></span>
          <span>${t.name}</span>
        `;
        item.addEventListener('click', () => {
          currentTrackIndex = index;
          synthSelect.value = tracks[currentTrackIndex].synthType;
          updateTrackUI();
          render();
        });
        trackListEl.appendChild(item);
      });
    }

    // 選択中のトラックの音色変更
    synthSelect.addEventListener('change', (e) => {
      if (!tracks[currentTrackIndex]) return;
      const type = e.target.value;
      tracks[currentTrackIndex].synth.dispose();
      tracks[currentTrackIndex].synthType = type;
      tracks[currentTrackIndex].synth = createSynth(type);
    });

    addTrackBtn.addEventListener('click', () => {
      addTrack();
    });

    bpmSlider.addEventListener('input', (e) => {
      bpm = parseInt(e.target.value);
      bpmVal.textContent = bpm;
      if (isPlaying) restartTimer();
    });

    function resizeCanvas() {
      const topOffset = document.getElementById('controls').offsetHeight + document.getElementById('track-bar').offsetHeight;
      canvas.width = window.innerWidth * window.devicePixelRatio;
      canvas.height = (window.innerHeight - topOffset) * window.devicePixelRatio;
      render();
    }
    window.addEventListener('resize', resizeCanvas);

    modeBtn.addEventListener('click', () => {
      if (mode === 'scroll') {
        mode = 'edit';
        modeBtn.textContent = 'モード: 打ち込み';
        modeBtn.style.backgroundColor = '#3b82f6';
      } else {
        mode = 'scroll';
        modeBtn.textContent = 'モード: スクロール';
        modeBtn.style.backgroundColor = '#f59e0b';
      }
    });

    // --- MIDIファイルの複数トラック解析 ---
    midiInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const buffer = await file.arrayBuffer();
      const parsedMidi = new Midi(buffer);

      // 既存トラック破棄
      tracks.forEach(t => t.synth.dispose());
      tracks = [];

      const fileBpm = Math.round(parsedMidi.header.tempos[0]?.bpm || 120);
      bpm = fileBpm;
      bpmSlider.value = bpm;
      bpmVal.textContent = bpm;

      parsedMidi.tracks.forEach((track, idx) => {
        if (track.notes.length === 0) return;

        addTrack(track.name || `Track ${tracks.length + 1}`);
        const currentT = tracks[tracks.length - 1];

        track.notes.forEach(n => {
          const startBeat = n.time * (fileBpm / 60);
          const duration = n.duration * (fileBpm / 60);
          currentT.notes.push({
            note: n.midi,
            startBeat: startBeat,
            duration: Math.max(duration, 0.25)
          });
        });
      });

      if (tracks.length === 0) addTrack(); // ノートが無い場合の初期トラック

      currentTrackIndex = 0;
      updateTrackUI();
      stopPlayback();
      scrollX = 0;
      render();
    });

    // --- タッチ・ピンチズーム管理 ---
    const activeTouches = new Map();
    let initialPinchDistance = null;
    let initialBeatWidth = beatWidth;
    let initialNoteHeight = noteHeight;
    let initialScrollX = 0;
    let initialScrollY = 0;
    let singleStartTouch = { x: 0, y: 0 };

    canvas.addEventListener('pointerdown', async (e) => {
      await Tone.start();
      canvas.setPointerCapture(e.pointerId);
      activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (activeTouches.size === 1) {
        singleStartTouch = { x: e.clientX, y: e.clientY };
        initialScrollX = scrollX;
        initialScrollY = scrollY;

        if (mode === 'edit' && tracks[currentTrackIndex]) {
          const rect = canvas.getBoundingClientRect();
          const clientX = (e.clientX - rect.left) * window.devicePixelRatio;
          const clientY = (e.clientY - rect.top) * window.devicePixelRatio;

          const beat = (clientX + scrollX) / beatWidth;
          const noteIdx = TOTAL_NOTES - 1 - Math.floor((clientY + scrollY) / noteHeight);
          const midiNote = MIN_NOTE + noteIdx;

          if (midiNote >= MIN_NOTE && midiNote <= MAX_NOTE) {
            const targetBeat = Math.floor(beat);
            const activeNotes = tracks[currentTrackIndex].notes;
            const existingIdx = activeNotes.findIndex(n => n.note === midiNote && Math.abs(n.startBeat - targetBeat) < 0.5);

            if (existingIdx >= 0) {
              activeNotes.splice(existingIdx, 1);
            } else {
              activeNotes.push({ note: midiNote, startBeat: targetBeat, duration: 1 });
              tracks[currentTrackIndex].synth.triggerAttackRelease(Tone.Frequency(midiNote, "midi").toNote(), "8n");
            }
            render();
          }
        }
      } else if (activeTouches.size === 2) {
        const points = Array.from(activeTouches.values());
        initialPinchDistance = Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
        initialBeatWidth = beatWidth;
        initialNoteHeight = noteHeight;
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!activeTouches.has(e.pointerId)) return;
      activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (activeTouches.size === 2 && initialPinchDistance) {
        const points = Array.from(activeTouches.values());
        const currentDistance = Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
        const scale = currentDistance / initialPinchDistance;

        beatWidth = Math.max(10, Math.min(150, initialBeatWidth * scale));
        noteHeight = Math.max(6, Math.min(50, initialNoteHeight * scale));

        render();
        return;
      }

      if (activeTouches.size === 1 && mode === 'scroll') {
        const dx = (e.clientX - singleStartTouch.x) * window.devicePixelRatio;
        const dy = (e.clientY - singleStartTouch.y) * window.devicePixelRatio;

        scrollX = Math.max(0, initialScrollX - dx);
        scrollY = Math.max(0, Math.min((TOTAL_NOTES * noteHeight) - canvas.height, initialScrollY - dy));

        render();
      }
    });

    const handlePointerEnd = (e) => {
      activeTouches.delete(e.pointerId);
      if (activeTouches.size < 2) initialPinchDistance = null;
    };

    canvas.addEventListener('pointerup', handlePointerEnd);
    canvas.addEventListener('pointercancel', handlePointerEnd);

    // --- 再生処理 (複数トラック全再生) ---
    playBtn.addEventListener('click', async () => {
      await Tone.start();
      if (isPlaying) stopPlayback();
      else startPlayback();
    });

    clearBtn.addEventListener('click', () => {
      tracks.forEach(t => t.notes = []);
      stopPlayback();
      render();
    });

    function startPlayback() {
      isPlaying = true;
      playBtn.textContent = '停止';
      playBtn.style.backgroundColor = '#f59e0b';
      restartTimer();
    }

    function restartTimer() {
      if (playTimer) clearInterval(playTimer);
      const intervalMs = (60 / bpm / 4) * 1000;

      playTimer = setInterval(() => {
        // すべてのトラックの該当ノーツを発音
        tracks.forEach(t => {
          t.notes.filter(n => Math.abs(n.startBeat - currentBeat) < 0.125).forEach(n => {
            t.synth.triggerAttackRelease(Tone.Frequency(n.note, "midi").toNote(), "8n");
          });
        });

        const cursorPx = currentBeat * beatWidth;
        if (cursorPx - scrollX > canvas.width * 0.8 || cursorPx < scrollX) {
          scrollX = Math.max(0, cursorPx - 100);
        }

        render();
        currentBeat += 0.25;
      }, intervalMs);
    }

    function stopPlayback() {
      isPlaying = false;
      playBtn.textContent = '再生';
      playBtn.style.backgroundColor = '#10b981';
      clearInterval(playTimer);
      currentBeat = 0;
      render();
    }

    // --- 描画処理 (全トラック描画) ---
    function render() {
      const width = canvas.width;
      const height = canvas.height;

      ctx.clearRect(0, 0, width, height);

      // 背景グリッド描画
      for (let i = 0; i < TOTAL_NOTES; i++) {
        const midiNote = MIN_NOTE + (TOTAL_NOTES - 1 - i);
        const y = (i * noteHeight) - scrollY;

        if (y + noteHeight < 0 || y > height) continue;

        const pitch = midiNote % 12;
        const isBlack = [1, 3, 6, 8, 10].includes(pitch);

        ctx.fillStyle = isBlack ? '#1a1a1a' : '#262626';
        ctx.fillRect(0, y, width, noteHeight);

        ctx.strokeStyle = '#333333';
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      // 拍の縦線描画
      const startB = Math.floor(scrollX / beatWidth);
      const endB = startB + Math.ceil(width / beatWidth) + 1;

      for (let b = startB; b < endB; b++) {
        const x = (b * beatWidth) - scrollX;
        ctx.strokeStyle = (b % 4 === 0) ? '#666666' : '#333333';
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }

      // 【拡張】全トラックのノーツを描画 (非アクティブトラックは少し透明化)
      tracks.forEach((t, tIdx) => {
        const isActive = (tIdx === currentTrackIndex);
        ctx.fillStyle = t.color;
        ctx.globalAlpha = isActive ? 1.0 : 0.4; // 選択中でないトラックは半透明で描画

        t.notes.forEach(n => {
          const noteIdx = TOTAL_NOTES - 1 - (n.note - MIN_NOTE);
          const x = (n.startBeat * beatWidth) - scrollX;
          const y = (noteIdx * noteHeight) - scrollY;
          const w = n.duration * beatWidth;

          if (x + w > 0 && x < width && y + noteHeight > 0 && y < height) {
            ctx.fillRect(x + 1, y + 1, Math.max(w - 2, 2), Math.max(noteHeight - 2, 2));
            if (isActive) {
              ctx.strokeStyle = '#ffffff';
              ctx.strokeRect(x + 1, y + 1, Math.max(w - 2, 2), Math.max(noteHeight - 2, 2));
            }
          }
        });
      });
      ctx.globalAlpha = 1.0;

      // 再生バー描画
      if (isPlaying) {
        const cursorX = (currentBeat * beatWidth) - scrollX;
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cursorX, 0);
        ctx.lineTo(cursorX, height);
        ctx.stroke();
        ctx.lineWidth = 1;
      }
    }

    // 初期トラック追加 & 画面リサイズ対応
    addTrack();
    resizeCanvas();
  </script>
</body>
</html>
