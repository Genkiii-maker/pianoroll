<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mobile MIDI Visualizer & Editor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    #controls {
      padding: 8px;
      background-color: #1e1e1e;
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      z-index: 10;
      border-bottom: 1px solid #333;
    }
    .btn {
      background-color: #3b82f6;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }
    input[type="file"] {
      display: none;
    }
    select {
      background-color: #2a2a2a;
      color: white;
      border: 1px solid #444;
      padding: 5px;
      border-radius: 6px;
      font-size: 12px;
    }
    .bpm-control {
      display: flex;
      align-items: center;
      gap: 4px;
      background-color: #2a2a2a;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #444;
      font-size: 12px;
    }
    .bpm-control input[type="range"] {
      width: 70px;
      accent-color: #3b82f6;
    }
    #editor-container {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <!-- Tone.js & Tonejs/Midi -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="https://unpkg.com/@tonejs/midi"></script>
</head>
<body>

  <div id="controls">
    <label class="btn" for="midi-input" style="background-color: #8b5cf6;">MIDI読込</label>
    <input type="file" id="midi-input" accept=".mid, .midi">
    
    <button id="play-btn" class="btn" style="background-color: #10b981;">再生</button>
    <button id="mode-btn" class="btn" style="background-color: #f59e0b;">モード: スクロール</button>
    <button id="clear-btn" class="btn" style="background-color: #ef4444;">全消去</button>
    
    <select id="synth-select">
      <option value="synth">Synth</option>
      <option value="fm">FM Synth</option>
      <option value="am">AM Synth</option>
    </select>

    <!-- BPMコントロール -->
    <div class="bpm-control">
      <label for="bpm-slider">BPM:</label>
      <input type="range" id="bpm-slider" min="40" max="240" value="120">
      <span id="bpm-val">120</span>
    </div>
  </div>

  <div id="editor-container">
    <canvas id="canvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const midiInput = document.getElementById('midi-input');
    const playBtn = document.getElementById('play-btn');
    const modeBtn = document.getElementById('mode-btn');
    const clearBtn = document.getElementById('clear-btn');
    const synthSelect = document.getElementById('synth-select');
    const bpmSlider = document.getElementById('bpm-slider');
    const bpmVal = document.getElementById('bpm-val');

    // 音域とグリッド定義 (全88鍵盤 21: A0 〜 108: C8)
    const MIN_NOTE = 21;
    const MAX_NOTE = 108;
    const TOTAL_NOTES = MAX_NOTE - MIN_NOTE + 1;
    const BEAT_WIDTH = 40; // 1拍の幅 (px)
    const NOTE_HEIGHT = 16; // 1音高の高さ (px)

    let notes = []; // [{ note: 60, startBeat: 0, duration: 1 }]
    let isPlaying = false;
    let currentBeat = 0;
    let playTimer = null;
    let mode = 'scroll'; // 'scroll' または 'edit'
    let bpm = 120;

    // スクロール用オフセット
    let scrollX = 0;
    let scrollY = (TOTAL_NOTES - 24) * NOTE_HEIGHT; // 中央音域（C4周辺）初期表示

    // --- Tone.js 音声設定 ---
    let synth = new Tone.PolySynth(Tone.Synth).toDestination();

    synthSelect.addEventListener('change', (e) => {
      synth.dispose();
      let type = Tone.Synth;
      if (e.target.value === 'fm') type = Tone.FMSynth;
      if (e.target.value === 'am') type = Tone.AMSynth;
      synth = new Tone.PolySynth(type).toDestination();
    });

    // --- BPMスライダー ---
    bpmSlider.addEventListener('input', (e) => {
      bpm = parseInt(e.target.value);
      bpmVal.textContent = bpm;
      if (isPlaying) {
        restartTimer();
      }
    });

    function resizeCanvas() {
      canvas.width = window.innerWidth * window.devicePixelRatio;
      canvas.height = (window.innerHeight - document.getElementById('controls').offsetHeight) * window.devicePixelRatio;
      render();
    }
    window.addEventListener('resize', resizeCanvas);

    // --- モード切替 ---
    modeBtn.addEventListener('click', () => {
      if (mode === 'scroll') {
        mode = 'edit';
        modeBtn.textContent = 'モード: 打ち込み';
        modeBtn.style.backgroundColor = '#3b82f6';
      } else {
        mode = 'scroll';
        modeBtn.textContent = 'モード: スクロール';
        modeBtn.style.backgroundColor = '#f59e0b';
      }
    });

    // --- MIDIファイルの読み込み ---
    midiInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const buffer = await file.arrayBuffer();
      const parsedMidi = new Midi(buffer);

      notes = [];
      const fileBpm = Math.round(parsedMidi.header.tempos[0]?.bpm || 120);
      bpm = fileBpm;
      bpmSlider.value = bpm;
      bpmVal.textContent = bpm;

      parsedMidi.tracks.forEach(track => {
        track.notes.forEach(n => {
          const startBeat = n.time * (fileBpm / 60);
          const duration = n.duration * (fileBpm / 60);
          notes.push({
            note: n.midi,
            startBeat: startBeat,
            duration: Math.max(duration, 0.25)
          });
        });
      });

      stopPlayback();
      scrollX = 0;
      render();
    });

    // --- スマホ タッチ操作 ---
    let isDragging = false;
    let startTouchX = 0, startTouchY = 0;
    let initialScrollX = 0, initialScrollY = 0;

    canvas.addEventListener('pointerdown', async (e) => {
      await Tone.start();
      isDragging = true;
      startTouchX = e.clientX;
      startTouchY = e.clientY;
      initialScrollX = scrollX;
      initialScrollY = scrollY;

      if (mode === 'edit') {
        const rect = canvas.getBoundingClientRect();
        const clientX = (e.clientX - rect.left) * window.devicePixelRatio;
        const clientY = (e.clientY - rect.top) * window.devicePixelRatio;

        const beat = (clientX + scrollX) / BEAT_WIDTH;
        const noteIdx = TOTAL_NOTES - 1 - Math.floor((clientY + scrollY) / NOTE_HEIGHT);
        const midiNote = MIN_NOTE + noteIdx;

        if (midiNote >= MIN_NOTE && midiNote <= MAX_NOTE) {
          const targetBeat = Math.floor(beat);
          const existingIdx = notes.findIndex(n => n.note === midiNote && Math.abs(n.startBeat - targetBeat) < 0.5);

          if (existingIdx >= 0) {
            notes.splice(existingIdx, 1);
          } else {
            notes.push({ note: midiNote, startBeat: targetBeat, duration: 1 });
            synth.triggerAttackRelease(Tone.Frequency(midiNote, "midi").toNote(), "8n");
          }
          render();
        }
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDragging || mode !== 'scroll') return;

      const dx = (e.clientX - startTouchX) * window.devicePixelRatio;
      const dy = (e.clientY - startTouchY) * window.devicePixelRatio;

      scrollX = Math.max(0, initialScrollX - dx);
      scrollY = Math.max(0, Math.min((TOTAL_NOTES * NOTE_HEIGHT) - canvas.height, initialScrollY - dy));

      render();
    });

    window.addEventListener('pointerup', () => { isDragging = false; });

    // --- 再生処理 ---
    playBtn.addEventListener('click', async () => {
      await Tone.start();
      if (isPlaying) stopPlayback();
      else startPlayback();
    });

    clearBtn.addEventListener('click', () => {
      notes = [];
      stopPlayback();
      render();
    });

    function startPlayback() {
      isPlaying = true;
      playBtn.textContent = '停止';
      playBtn.style.backgroundColor = '#f59e0b';
      restartTimer();
    }

    function restartTimer() {
      if (playTimer) clearInterval(playTimer);

      // 16分音符ごとの間隔 (ミリ秒) をBPMから計算
      const intervalMs = (60 / bpm / 4) * 1000;

      playTimer = setInterval(() => {
        // 発音処理
        notes.filter(n => Math.abs(n.startBeat - currentBeat) < 0.125).forEach(n => {
          synth.triggerAttackRelease(Tone.Frequency(n.note, "midi").toNote(), "8n");
        });

        // スクロール追従
        const cursorPx = currentBeat * BEAT_WIDTH;
        if (cursorPx - scrollX > canvas.width * 0.8 || cursorPx < scrollX) {
          scrollX = Math.max(0, cursorPx - 100);
        }

        render();
        currentBeat += 0.25;
      }, intervalMs);
    }

    function stopPlayback() {
      isPlaying = false;
      playBtn.textContent = '再生';
      playBtn.style.backgroundColor = '#10b981';
      clearInterval(playTimer);
      currentBeat = 0;
      render();
    }

    // --- 描画処理 ---
    function render() {
      const width = canvas.width;
      const height = canvas.height;

      ctx.clearRect(0, 0, width, height);

      // 背景グリッド描画
      for (let i = 0; i < TOTAL_NOTES; i++) {
        const midiNote = MIN_NOTE + (TOTAL_NOTES - 1 - i);
        const y = (i * NOTE_HEIGHT) - scrollY;

        if (y + NOTE_HEIGHT < 0 || y > height) continue;

        const pitch = midiNote % 12;
        const isBlack = [1, 3, 6, 8, 10].includes(pitch);

        ctx.fillStyle = isBlack ? '#1a1a1a' : '#262626';
        ctx.fillRect(0, y, width, NOTE_HEIGHT);

        ctx.strokeStyle = '#333333';
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      // 拍の縦線描画
      const startB = Math.floor(scrollX / BEAT_WIDTH);
      const endB = startB + Math.ceil(width / BEAT_WIDTH) + 1;

      for (let b = startB; b < endB; b++) {
        const x = (b * BEAT_WIDTH) - scrollX;
        ctx.strokeStyle = (b % 4 === 0) ? '#666666' : '#333333';
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }

      // ノート描画
      notes.forEach(n => {
        const noteIdx = TOTAL_NOTES - 1 - (n.note - MIN_NOTE);
        const x = (n.startBeat * BEAT_WIDTH) - scrollX;
        const y = (noteIdx * NOTE_HEIGHT) - scrollY;
        const w = n.duration * BEAT_WIDTH;

        if (x + w > 0 && x < width && y + NOTE_HEIGHT > 0 && y < height) {
          ctx.fillStyle = '#3b82f6';
          ctx.fillRect(x + 1, y + 1, Math.max(w - 2, 2), NOTE_HEIGHT - 2);
        }
      });

      // 再生バー描画
      if (isPlaying) {
        const cursorX = (currentBeat * BEAT_WIDTH) - scrollX;
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cursorX, 0);
        ctx.lineTo(cursorX, height);
        ctx.stroke();
        ctx.lineWidth = 1;
      }
    }

    resizeCanvas();
  </script>
</body>
</html>
